spring:
  application:
    name: commerce-backend

  datasource:
    url: jdbc:mysql://localhost:3306/commerce_db
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6381

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

server:
  error:
    include-stacktrace: never